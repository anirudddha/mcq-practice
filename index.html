<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Practice Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="hero">
                <h1>Test Your Knowledge</h1>
                <p>Ready to challenge yourself? Each attempt is randomly shuffled.</p>
                <div class="test-selection">
                    <select id="test-select" class="test-dropdown">
                        <option value="questions.json">Test 1 (General)</option>
                        <option value="prefa.json">Test 2 (Prefa)</option>
                        <option value="mcq_1.json">Test 3 (MCQ 1)</option>
                        <option value="r_mcq.json">Test 4 (R Programming)</option>
                        <option value="numpy_pandas_practice.json">Practice Test (Numpy Pandas)</option>
                    </select>
                </div>
                <div class="action-buttons" style="flex-wrap: wrap;">
                    <button id="start-btn" class="primary-btn">Start Quiz</button>
                    <button id="view-btn" class="secondary-btn">View Questions</button>
                    <button id="coding-practice-btn" class="primary-btn" style="width: 100%; margin-top: 10px; background: linear-gradient(90deg, #6366f1, #8b5cf6);">Coding Practice</button>
                </div>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <header class="quiz-header">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div class="quiz-meta">
                    <span id="question-stats">Question 1 of 10</span>
                    <span id="category-badge" class="badge">Category</span>
                </div>
            </header>

            <main class="question-container">
                <h2 id="question-text">Loading question...</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options injected here -->
                </div>
            </main>
        </div>

        <!-- Coding Screen -->
        <div id="coding-screen" class="screen">
            <div class="coding-header">
                <button id="coding-back-btn" class="secondary-btn btn-small">Back</button>
                <select id="question-select" class="test-dropdown" style="padding: 0.5rem; max-width: 250px; font-weight: bold; font-size: 1.1rem; background: rgba(0,0,0,0.3);">
                    <option value="">Loading...</option>
                </select>
                <div class="coding-controls" style="display: flex; gap: 10px; align-items: center;">
                    <select id="language-select" class="test-dropdown" style="padding: 0.5rem; width: auto;">
                        <option value="python3">Python 3</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                    <button id="run-code-btn" class="primary-btn btn-small" style="padding: 0.5rem 1rem;">Run Code</button>
                </div>
            </div>

            <div class="coding-layout">
                <div class="coding-problem scrollable-area">
                    <div class="badge" id="coding-difficulty" style="display:inline-block; margin-bottom:1rem;">Easy</div>
                    <p id="coding-description" style="white-space: pre-wrap;">Loading description...</p>
                </div>
                <div class="coding-editor-container">
                    <textarea id="code-editor"></textarea>
                </div>
            </div>
            
            <div class="coding-output-section">
                <h3 style="font-size: 1rem; margin-bottom: 0.5rem; color: var(--text-muted);">Output Terminal</h3>
                <div id="coding-output-terminal" class="terminal-box">
                    Ready to run...
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen scrollable">
            <div class="result-header">
                <h2>Quiz Complete!</h2>
                <div class="score-circle">
                    <span id="score-text">0/0</span>
                    <span class="score-label">Score</span>
                </div>
            </div>

            <div class="review-section">
                <h3>Review Your Answers</h3>
                <div id="review-container" class="review-list">
                    <!-- Review items injected here -->
                </div>
            </div>

            <button id="restart-btn" class="primary-btn mt-4">Play Again</button>
        </div>

        <!-- View Screen -->
        <div id="view-screen" class="screen scrollable">
            <div class="view-header">
                <h2>All Questions</h2>
                <button id="back-btn" class="secondary-btn btn-small">Back to Home</button>
            </div>

            <div id="all-questions-container" class="all-questions-list">
                <!-- All questions injected here -->
            </div>
        </div>
    </div>

    <div class="signature">Powered by Aniruddha</div>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
